name: 🚨 Bug report
description: Something in Loadout Manager does not work as it should.
title: '🚨 '
type: Bug

body:
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The dsh-loadout-manager version, and how it was installed (npm, Git URL, or a local directory).
      placeholder: "e.g. '1.2.1 from npm'"
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DSH version and OS
      placeholder: "e.g. 'DSH Desktop 0.2.2-rc.2 on Windows 11'"
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Loadout Manager in the Global scope
        2. Switch the skill '...' to manual
        3. ...
    validations:
      required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: What happens
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Errors from the DSH log or the error text shown on the page, if there are any.
      render: shell
    validations:
      required: false
