name: CD

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Release to npm
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: the registry accepts the job's OIDC token instead of a stored npm token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; Node 24 may ship an older npm 11.
      - run: npm install -g npm@^11.5.1
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
      # The CI test job has checked that the committed lib/ matches the sources, so the package ships it as is.
      - run: npm publish --access public
